[project]
name = "cursopythonib_proy_termo"
version = "0.1.0"
description = "Proyecto de termodinámica para el curso de Python I.B."
requires-python = ">=3.15"
dependencies = [
    "coolprop>=8.0.0",
    "iapws>=1.5.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "thermochem>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curso_python_ib_proy_termo"]
